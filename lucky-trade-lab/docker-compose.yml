services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////data/opc_trade.sqlite
      - LOG_LEVEL=INFO
      - LIVE_TRADING_ENABLED=false
    volumes:
      - opc_data:/data
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////data/opc_trade.sqlite
      - LOG_LEVEL=INFO
      - LIVE_TRADING_ENABLED=false
    volumes:
      - opc_data:/data
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  opc_data:
  caddy_data:
  caddy_config:
